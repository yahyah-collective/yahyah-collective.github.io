<style>
* {
  box-sizing: border-box;
}

body {
  background-image: url('yahyah/ghgg.bckgd.png');
  font-family: "Anonymous Pro";
}

/* Center website */
.main {
  max-width: 1600px;
  margin: auto;
}

h1 {
  font-size: 50px;
  word-break: break-all;
}

.row {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 8px -16px;
  text-align: center;
}

/* Add padding BETWEEN each column */
.row,
.row > .column {
  padding: 8px;
}

/* Create four equal columns that floats next to each other */
.column {
  float: left;
  width: 25%;
}

/* Clear floats after rows */ 
.row:after {
  content: "";
  display: table;
  clear: both;
}

/* Content */
.content {
  background-color: white;
  padding: 10px;
}

.right {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 25%;
  margin: auto;
  text-align: center;
}

.right video {
  max-width: 100%;
  height: auto;
}

.theright {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 55%%;
  margin: auto;
  text-align: center;
}

.theright video {
  max-width: 100%;
  height: auto;
}

/* Responsive layout - makes a two column-layout instead of four columns */
@media screen and (max-width: 900px) {
  .column {
    width: 50%;
  }
}

/* Responsive layout - makes the two columns stack on top of each other instead of next to each other */
@media screen and (max-width: 600px) {
  .column {
    width: 100%;
  }
}
</style>
</head>
